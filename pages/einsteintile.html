<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aperiodic Monotile Field</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #03040d;
      --ink: #f7f4ff;
      --panel: rgba(8, 7, 23, 0.72);
      --panel-border: rgba(203, 188, 255, 0.27);
      --button-bg: rgba(255, 255, 255, 0.1);
      --button-hover: rgba(255, 255, 255, 0.18);
      --active: #d8c7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    #stage.dragging {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      top: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 2;
      pointer-events: none;
    }

    .control-panel {
      display: grid;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(16px);
      pointer-events: auto;
    }

    .theme-panel {
      grid-template-columns: 42px;
    }

    .action-panel {
      grid-template-columns: 42px;
    }

    .hud button {
      position: relative;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: var(--button-bg);
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      overflow: hidden;
    }

    .hud button:hover {
      background: var(--button-hover);
    }

    .hud button[aria-pressed="true"] {
      border-color: var(--active);
      box-shadow: 0 0 0 2px rgba(142, 239, 255, 0.22), 0 0 22px rgba(142, 239, 255, 0.26);
    }

    .hud svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-option::before {
      position: absolute;
      inset: 5px;
      content: "";
      border-radius: 6px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }

    .theme-option[data-theme="ocean"]::before {
      background:
        linear-gradient(90deg, #083d77 0 25%, #0b7285 25% 50%, #68b0ab 50% 75%, #f4f1de 75%);
    }

    .theme-option[data-theme="fire"]::before {
      background:
        linear-gradient(90deg, #2b0504 0 25%, #9d0208 25% 50%, #f48c06 50% 75%, #ffba08 75%);
    }

    .theme-option[data-theme="cosmic"]::before {
      background:
        radial-gradient(circle at 24% 22%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 73% 68%, #bcf7ff 0 1px, transparent 2px),
        linear-gradient(90deg, #282a36 0 25%, #6272a4 25% 50%, #bd93f9 50% 75%, #ff79c6 75%);
    }

    .theme-option[data-theme="hole"]::before {
      background:
        radial-gradient(circle at center, #050505 0 28%, transparent 30%),
        linear-gradient(90deg, #f7f2e4 0 25%, #d64035 25% 50%, #2364aa 50% 75%, #f3c742 75%);
    }

    .spin-active svg {
      animation: spinIcon 0.72s linear infinite;
    }

    @keyframes spinIcon {
      to {
        transform: rotate(360deg);
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Aperiodic monotile canvas"></canvas>

  <div class="hud">
    <div class="control-panel theme-panel" aria-label="Color themes">
      <button class="theme-option" type="button" data-theme="hole" aria-label="Hole theme" aria-pressed="false" title="Hole">
        <span class="sr-only">Hole</span>
      </button>
      <button class="theme-option" type="button" data-theme="ocean" aria-label="Ocean theme" aria-pressed="false" title="Ocean">
        <span class="sr-only">Ocean</span>
      </button>
      <button class="theme-option" type="button" data-theme="fire" aria-label="Fire theme" aria-pressed="false" title="Fire">
        <span class="sr-only">Fire</span>
      </button>
      <button class="theme-option" type="button" data-theme="cosmic" aria-label="COSMIC theme" aria-pressed="true" title="COSMIC">
        <span class="sr-only">COSMIC</span>
      </button>
    </div>
    <div class="control-panel action-panel">
      <button id="drop" type="button" aria-label="Tile hole mode" aria-pressed="false" title="Tile hole">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16"></path>
          <path d="M12 10v9"></path>
          <path d="m8 15 4 4 4-4"></path>
        </svg>
      </button>
      <button id="spin" type="button" aria-label="Spin mode" aria-pressed="false" title="Spin">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3c4.5 0 8 3.2 8 7.3 0 4.8-4.6 8.7-9.2 7.3-3.6-1.1-5.5-5.1-3.7-8.2 1.4-2.4 4.8-3.2 7-1.6 2 1.4 2 4.5-0.1 5.6-1.7 0.9-3.8-0.2-3.8-2"></path>
        </svg>
      </button>
      <button id="reset" type="button" aria-label="Reset view" title="Reset">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7"></path>
          <path d="M3 4v6h6"></path>
        </svg>
      </button>
    </div>
  </div>

    const canvas = document.querySelector("#stage");
    const ctx = canvas.getContext("2d");
    const resetButton = document.querySelector("#reset");
    const dropButton = document.querySelector("#drop");
    const spinButton = document.querySelector("#spin");
    const themeButtons = [...document.querySelectorAll("[data-theme]")];

    const sqrt3 = Math.sqrt(3);
    const halfSqrt3 = sqrt3 / 2;
    const pi = Math.PI;
    const ident = [1, 0, 0, 0, 1, 0];
    const holeLineInset = 0.05;
    const holeMinLineDepth = 4;
    const tileFieldExtent = Math.sqrt(0.4);
    const tileMotionDuration = 780;
    const sharedTileColor = { r: 142, g: 165, b: 156, css: "rgb(142, 165, 156)" };
    const geometryWasmBase64 =
      "AGFzbQEAAAABHgRgAAF/YAJ/fwF/YAN/f38Bf2AJf3x8fHx8fHx/AAMIBwAAAAECAQMFAwEAMAYZA38BQYCAwAALfwBBgIDAAQt/AEGAgMABCweHAQoGbWVtb3J5AgAJaW5wdXRfcHRyAAAKb3V0cHV0X3B0cgABCm1heF9wb2ludHMAAgpjb2xvcl9oYXNoAAMMcGFsZXR0ZV9zbG90AAQKdG9uZV9kZWx0YQAFEHRyYW5zZm9ybV9wb2ludHMABgpfX2RhdGFfZW5kAwELX19oZWFwX2Jhc2UDAgqWBAcIAEGAgMCAAAsIAEGAgICBAAsGAEGAgAQLQgAgAEGx893xeWwgAUH3lK+veGxzQb3cypV8cyIBQRB2IAFzQa3qrP8HbCIBQQ92IAFzQYvNsqN4bCIBQRB2IAFzC08AAkAgAg0AQQAPCyAAQbHz3fF5bCABQfeUr694bHNBvdzKlXxzIgFBEHYgAXNBreqs/wdsIgFBD3YgAXNBi82yo3hsIgFBEHYgAXMgAnALVgAgAEGx893xeWxB7/jexQJqIAFB95Svr3hsQZmc3toBanNBvdzKlXxzIgFBEHYgAXNBreqs/wdsIgFBD3YgAXNBi82yo3hsIgFBEHYgAXNBGXBBdGoLkAIBAnwCQCAARQ0AIABBgIAEIABBgIAESRshAAJAIAhFDQAgAkQAAAAAAADgP6IhAiABRAAAAAAAAOA/oiEBIABBBHQhCEEAIQADQCAAQYiAgIEAaiACIAcgBCADIABBgIDAgABqKwMAoqAgAaEiCaKgIAYgBSADIABBiIDAgABqKwMAoqEgAqEiCqKgOQMAIABBgICAgQBqIAEgBiAJoqAgByAKoqE5AwAgCCAAQRBqIgBHDQAMAgsLIABBBHQhCEEAIQADQCAAQYiAgIEAaiAFIAMgAEGIgMCAAGorAwCioTkDACAAQYCAgIEAaiAEIAMgAEGAgMCAAGorAwCioDkDACAIIABBEGoiAEcNAAsLCwCRAQRuYW1lABgXZWluc3RlaW5fdHJhbnNmb3JtLndhc20BXAcACWlucHV0X3B0cgEKb3V0cHV0X3B0cgIKbWF4X3BvaW50cwMKY29sb3JfaGFzaAQMcGFsZXR0ZV9zbG90BQp0b25lX2RlbHRhBhB0cmFuc2Zvcm1fcG9pbnRzBxIBAA9fX3N0YWNrX3BvaW50ZXIAPQlwcm9kdWNlcnMBDHByb2Nlc3NlZC1ieQEFcnVzdGMdMS44Ny4wICgxNzA2N2U5YWMgMjAyNS0wNS0wOSkAlAEPdGFyZ2V0X2ZlYXR1cmVzCCsLYnVsay1tZW1vcnkrD2J1bGstbWVtb3J5LW9wdCsWY2FsbC1pbmRpcmVjdC1vdmVybG9uZysKbXVsdGl2YWx1ZSsPbXV0YWJsZS1nbG9iYWxzKxNub250cmFwcGluZy1mcHRvaW50Kw9yZWZlcmVuY2UtdHlwZXMrCHNpZ24tZXh0";
    const themes = {
      hole: {
        key: "hole",
        bg: "#050505",
        ink: "#f7f2e4",
        panel: "rgba(12, 12, 12, 0.72)",
        border: "rgba(247, 242, 228, 0.22)",
        active: "#f3c742",
        animated: false,
        edge: "rgba(5, 5, 5, 0.3)",
        shadow: "rgba(0, 0, 0, 0.7)",
        palette: ["#f7f2e4", "#d64035", "#2364aa", "#f3c742", "#2a9d8f", "#111111"],
      },
      ocean: {
        key: "ocean",
        bg: "#061923",
        ink: "#edf9f8",
        panel: "rgba(5, 18, 25, 0.68)",
        border: "rgba(179, 236, 255, 0.24)",
        active: "#68b0ab",
        animated: false,
        edge: "rgba(239, 249, 248, 0.18)",
        shadow: "rgba(0, 24, 36, 0.58)",
        palette: ["#083d77", "#0b7285", "#2f7caa", "#68b0ab", "#f4f1de", "#1d3557"],
      },
      fire: {
        key: "fire",
        bg: "#190405",
        ink: "#fff4dc",
        panel: "rgba(31, 6, 4, 0.72)",
        border: "rgba(255, 184, 91, 0.28)",
        active: "#ffbd52",
        animated: false,
        edge: "rgba(255, 234, 197, 0.12)",
        shadow: "rgba(18, 0, 0, 0.58)",
        palette: ["#2b0504", "#6a040f", "#9d0208", "#dc2f02", "#f48c06", "#ffba08"],
      },
      cosmic: {
        key: "cosmic",
        bg: "#03040d",
        ink: "#f7f4ff",
        panel: "rgba(8, 7, 23, 0.72)",
        border: "rgba(203, 188, 255, 0.27)",
        active: "#d8c7ff",
        animated: true,
        edge: "rgba(247, 244, 255, 0.14)",
        shadow: "rgba(0, 0, 16, 0.68)",
        palette: ["#282a36", "#44475a", "#6272a4", "#8be9fd", "#bd93f9", "#ff79c6", "#f1fa8c"],
      },
    };
    const starField = createStarField(180);

    let dpr = 1;
    let width = 0;
    let height = 0;
    let scale = 21;
    let panX = 0;
    let panY = 0;
    let startX = 0;
    let startY = 0;
    let startPanX = 0;
    let startPanY = 0;
    let activePointerId = null;
    let renderQueued = false;
    let leaves = [];
    let bounds = null;
    let spatialIndex = new Map();
    let gridCellSize = 12;
    let currentTheme = themes.cosmic;
    let wasmPalette = null;
    let wasmMemory = null;
    let wasmInputOffset = 0;
    let wasmOutputOffset = 0;
    let wasmMaxPoints = 0;
    let spinEnabled = false;
    let dropEnabled = false;
    let spinAngle = 0;
    let lastFrameTime = 0;
    let cachedLocalHoleGeometry = null;
    let tileMotion = new Map();

    function pt(x, y) {
      return { x, y };
    }

    function hexPt(x, y) {
      return pt(x + 0.5 * y, halfSqrt3 * y);
    }

    function padd(p, q) {
      return pt(p.x + q.x, p.y + q.y);
    }

    function psub(p, q) {
      return pt(p.x - q.x, p.y - q.y);
    }

    function inv(T) {
      const det = T[0] * T[4] - T[1] * T[3];
      return [
        T[4] / det,
        -T[1] / det,
        (T[1] * T[5] - T[2] * T[4]) / det,
        -T[3] / det,
        T[0] / det,
        (T[2] * T[3] - T[0] * T[5]) / det,
      ];
    }

    function mul(A, B) {
      return [
        A[0] * B[0] + A[1] * B[3],
        A[0] * B[1] + A[1] * B[4],
        A[0] * B[2] + A[1] * B[5] + A[2],
        A[3] * B[0] + A[4] * B[3],
        A[3] * B[1] + A[4] * B[4],
        A[3] * B[2] + A[4] * B[5] + A[5],
      ];
    }

    function trot(angle) {
      const c = Math.cos(angle);
      const s = Math.sin(angle);
      return [c, -s, 0, s, c, 0];
    }

    function ttrans(tx, ty) {
      return [1, 0, tx, 0, 1, ty];
    }

    function rotAbout(p, angle) {
      return mul(ttrans(p.x, p.y), mul(trot(angle), ttrans(-p.x, -p.y)));
    }

    function transPt(M, P) {
      return pt(M[0] * P.x + M[1] * P.y + M[2], M[3] * P.x + M[4] * P.y + M[5]);
    }

    function matchSeg(p, q) {
      return [q.x - p.x, p.y - q.y, p.x, q.y - p.y, q.x - p.x, p.y];
    }

    function matchTwo(p1, q1, p2, q2) {
      return mul(matchSeg(p2, q2), inv(matchSeg(p1, q1)));
    }

    function intersect(p1, q1, p2, q2) {
      const d = (q2.y - p2.y) * (q1.x - p1.x) - (q2.x - p2.x) * (q1.y - p1.y);
      const uA = ((q2.x - p2.x) * (p1.y - p2.y) - (q2.y - p2.y) * (p1.x - p2.x)) / d;
      return pt(p1.x + uA * (q1.x - p1.x), p1.y + uA * (q1.y - p1.y));
    }

    const hatOutline = [
      hexPt(0, 0),
      hexPt(-1, -1),
      hexPt(0, -2),
      hexPt(2, -2),
      hexPt(2, -1),
      hexPt(4, -2),
      hexPt(5, -1),
      hexPt(4, 0),
      hexPt(3, 0),
      hexPt(2, 2),
      hexPt(0, 3),
      hexPt(0, 2),
      hexPt(-1, 2),
    ];

    class HatTile {
      collect(T, out) {
        out.push({ T, color: sharedTileColor });
      }
    }

    class MetaTile {
      constructor(shape, width) {
        this.shape = shape;
        this.width = width;
        this.children = [];
      }

      addChild(T, geom) {
        this.children.push({ T, geom });
      }

      evalChild(n, i) {
        return transPt(this.children[n].T, this.children[n].geom.shape[i]);
      }

      recenter() {
        let cx = 0;
        let cy = 0;
        for (const p of this.shape) {
          cx += p.x;
          cy += p.y;
        }
        cx /= this.shape.length;
        cy /= this.shape.length;

        const tr = pt(-cx, -cy);
        for (let i = 0; i < this.shape.length; i += 1) {
          this.shape[i] = padd(this.shape[i], tr);
        }

        const M = ttrans(-cx, -cy);
        for (const child of this.children) {
          child.T = mul(M, child.T);
        }
      }

      collect(T, out) {
        for (const child of this.children) {
          child.geom.collect(mul(T, child.T), out);
        }
      }
    }

    function colorString(color, alpha) {
      return `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
    }

    function clampColor(value) {
      return Math.max(0, Math.min(255, Math.round(value)));
    }

    function hexToColor(hex) {
      const value = Number.parseInt(hex.slice(1), 16);
      return {
        r: value >> 16 & 255,
        g: value >> 8 & 255,
        b: value & 255,
      };
    }

    function shiftColor(color, amount) {
      return {
        r: clampColor(color.r + amount),
        g: clampColor(color.g + amount),
        b: clampColor(color.b + amount),
      };
    }

    function scaleColor(color, factor) {
      return {
        r: clampColor(color.r * factor),
        g: clampColor(color.g * factor),
        b: clampColor(color.b * factor),
      };
    }

    function fract(value) {
      return value - Math.floor(value);
    }

    function seededNoise(a, b) {
      return fract(Math.sin(a * 12.9898 + b * 78.233) * 43758.5453);
    }

    function createStarField(count) {
      const stars = [];
      for (let i = 0; i < count; i += 1) {
        const x = seededNoise(i + 0.3, 11.7);
        const y = seededNoise(i + 2.1, 31.4);
        stars.push({
          x,
          y,
          size: 0.65 + seededNoise(i + 9.2, 5.6) * 2.1,
          phase: seededNoise(i + 4.8, 91.1) * pi * 2,
          speed: 0.7 + seededNoise(i + 7.4, 42.5) * 1.8,
        });
      }
      return stars;
    }

    function fallbackHash(a, b) {
      let x = Math.imul(a, 0x9e3779b1) >>> 0;
      x = (x ^ Math.imul(b, 0x85ebca77)) >>> 0;
      x = (x ^ 0xc2b2ae3d) >>> 0;
      x = (x ^ x >>> 16) >>> 0;
      x = Math.imul(x, 0x7feb352d) >>> 0;
      x = (x ^ x >>> 15) >>> 0;
      x = Math.imul(x, 0x846ca68b) >>> 0;
      return (x ^ x >>> 16) >>> 0;
    }

    function paletteSlot(a, b, length) {
      if (wasmPalette) {
        return wasmPalette.palette_slot(a, b, length) >>> 0;
      }
      return fallbackHash(a, b) % length;
    }

    function toneDelta(a, b) {
      if (wasmPalette) {
        return wasmPalette.tone_delta(a, b);
      }
      return fallbackHash(a + 31, b - 17) % 25 - 12;
    }

    async function initGeometryWasm() {
      if (!("WebAssembly" in window)) {
        return;
      }

      try {
        const bytes = Uint8Array.from(atob(geometryWasmBase64), (char) => char.charCodeAt(0));
        const { instance } = await WebAssembly.instantiate(bytes);
        wasmPalette = instance.exports;
        wasmMemory = new Float64Array(wasmPalette.memory.buffer);
        wasmInputOffset = wasmPalette.input_ptr() / Float64Array.BYTES_PER_ELEMENT;
        wasmOutputOffset = wasmPalette.output_ptr() / Float64Array.BYTES_PER_ELEMENT;
        wasmMaxPoints = wasmPalette.max_points();
        assignTileStyles();
        queueRender();
      } catch (error) {
        console.warn("Geometry wasm failed to initialize; using JS fallback.", error);
      }
    }

    function assignTileStyles() {
      if (!leaves.length) {
        return;
      }

      const palette = currentTheme.palette.map(hexToColor);
      for (const tile of leaves) {
        const slot = paletteSlot(tile.hashX, tile.hashY, palette.length);
        const delta = toneDelta(tile.hashX, tile.hashY);
        tile.fill = shiftColor(palette[slot], delta);
      }
    }

    function applyTheme(themeName) {
      currentTheme = themes[themeName] || themes.hole;
      document.documentElement.style.setProperty("--bg", currentTheme.bg);
      document.documentElement.style.setProperty("--ink", currentTheme.ink);
      document.documentElement.style.setProperty("--panel", currentTheme.panel);
      document.documentElement.style.setProperty("--panel-border", currentTheme.border);
      document.documentElement.style.setProperty("--active", currentTheme.active);

      for (const button of themeButtons) {
        button.setAttribute("aria-pressed", String(button.dataset.theme === currentTheme.key));
      }

      assignTileStyles();
      queueRender();
    }

    function setDropMode(enabled) {
      dropEnabled = enabled;
      dropButton.setAttribute("aria-pressed", String(dropEnabled));
      queueRender();
    }

    function setSpinMode(enabled) {
      spinEnabled = enabled;
      spinButton.setAttribute("aria-pressed", String(spinEnabled));
      spinButton.classList.toggle("spin-active", spinEnabled);
      queueRender();
    }

    function createInitialTiles() {
      const hat = new HatTile();

      const H = (() => {
        const outline = [
          pt(0, 0),
          pt(4, 0),
          pt(4.5, halfSqrt3),
          pt(2.5, 5 * halfSqrt3),
          pt(1.5, 5 * halfSqrt3),
          pt(-0.5, halfSqrt3),
        ];
        const meta = new MetaTile(outline, 2);
        meta.addChild(matchTwo(hatOutline[5], hatOutline[7], outline[5], outline[0]), hat);
        meta.addChild(matchTwo(hatOutline[9], hatOutline[11], outline[1], outline[2]), hat);
        meta.addChild(matchTwo(hatOutline[5], hatOutline[7], outline[3], outline[4]), hat);
        meta.addChild(mul(ttrans(2.5, halfSqrt3), mul([-0.5, -halfSqrt3, 0, halfSqrt3, -0.5, 0], [0.5, 0, 0, 0, -0.5, 0])), hat);
        return meta;
      })();

      const T = (() => {
        const outline = [pt(0, 0), pt(3, 0), pt(1.5, 3 * halfSqrt3)];
        const meta = new MetaTile(outline, 2);
        meta.addChild([0.5, 0, 0.5, 0, 0.5, halfSqrt3], hat);
        return meta;
      })();

      const P = (() => {
        const outline = [pt(0, 0), pt(4, 0), pt(3, 2 * halfSqrt3), pt(-1, 2 * halfSqrt3)];
        const meta = new MetaTile(outline, 2);
        meta.addChild([0.5, 0, 1.5, 0, 0.5, halfSqrt3], hat);
        meta.addChild(mul(ttrans(0, 2 * halfSqrt3), mul([0.5, halfSqrt3, 0, -halfSqrt3, 0.5, 0], [0.5, 0, 0, 0, 0.5, 0])), hat);
        return meta;
      })();

      const F = (() => {
        const outline = [pt(0, 0), pt(3, 0), pt(3.5, halfSqrt3), pt(3, 2 * halfSqrt3), pt(-1, 2 * halfSqrt3)];
        const meta = new MetaTile(outline, 2);
        meta.addChild([0.5, 0, 1.5, 0, 0.5, halfSqrt3], hat);
        meta.addChild(mul(ttrans(0, 2 * halfSqrt3), mul([0.5, halfSqrt3, 0, -halfSqrt3, 0.5, 0], [0.5, 0, 0, 0, 0.5, 0])), hat);
        return meta;
      })();

      return [H, T, P, F];
    }

    function constructPatch(H, T, P, F) {
      const rules = [
        ["H"],
        [0, 0, "P", 2],
        [1, 0, "H", 2],
        [2, 0, "P", 2],
        [3, 0, "H", 2],
        [4, 4, "P", 2],
        [0, 4, "F", 3],
        [2, 4, "F", 3],
        [4, 1, 3, 2, "F", 0],
        [8, 3, "H", 0],
        [9, 2, "P", 0],
        [10, 2, "H", 0],
        [11, 4, "P", 2],
        [12, 0, "H", 2],
        [13, 0, "F", 3],
        [14, 2, "F", 1],
        [15, 3, "H", 4],
        [8, 2, "F", 1],
        [17, 3, "H", 0],
        [18, 2, "P", 0],
        [19, 2, "H", 2],
        [20, 4, "F", 3],
        [20, 0, "P", 2],
        [22, 0, "H", 2],
        [23, 4, "F", 3],
        [23, 0, "F", 3],
        [16, 0, "P", 2],
        [9, 4, 0, 2, "T", 2],
        [4, 0, "F", 3],
      ];
      const ret = new MetaTile([], H.width);
      const shapes = { H, T, P, F };

      for (const rule of rules) {
        if (rule.length === 1) {
          ret.addChild(ident, shapes[rule[0]]);
        } else if (rule.length === 4) {
          const poly = ret.children[rule[0]].geom.shape;
          const T0 = ret.children[rule[0]].T;
          const P0 = transPt(T0, poly[(rule[1] + 1) % poly.length]);
          const Q0 = transPt(T0, poly[rule[1]]);
          const nextShape = shapes[rule[2]];
          const nextPoly = nextShape.shape;
          ret.addChild(matchTwo(nextPoly[rule[3]], nextPoly[(rule[3] + 1) % nextPoly.length], P0, Q0), nextShape);
        } else {
          const childP = ret.children[rule[0]];
          const childQ = ret.children[rule[2]];
          const P0 = transPt(childQ.T, childQ.geom.shape[rule[3]]);
          const Q0 = transPt(childP.T, childP.geom.shape[rule[1]]);
          const nextShape = shapes[rule[4]];
          const nextPoly = nextShape.shape;
          ret.addChild(matchTwo(nextPoly[rule[5]], nextPoly[(rule[5] + 1) % nextPoly.length], P0, Q0), nextShape);
        }
      }

      return ret;
    }

    function constructMetatiles(patch) {
      const bps1 = patch.evalChild(8, 2);
      const bps2 = patch.evalChild(21, 2);
      const rbps = transPt(rotAbout(bps1, -2 * pi / 3), bps2);
      const p72 = patch.evalChild(7, 2);
      const p252 = patch.evalChild(25, 2);
      const llc = intersect(bps1, rbps, patch.evalChild(6, 2), p72);
      let w = psub(patch.evalChild(6, 2), llc);

      const newHOutline = [llc, bps1];
      w = transPt(trot(-pi / 3), w);
      newHOutline.push(padd(newHOutline[1], w));
      newHOutline.push(patch.evalChild(14, 2));
      w = transPt(trot(-pi / 3), w);
      newHOutline.push(psub(newHOutline[3], w));
      newHOutline.push(patch.evalChild(6, 2));

      const newH = new MetaTile(newHOutline, patch.width * 2);
      for (const child of [0, 9, 16, 27, 26, 6, 1, 8, 10, 15]) {
        newH.addChild(patch.children[child].T, patch.children[child].geom);
      }

      const newPOutline = [p72, padd(p72, psub(bps1, llc)), bps1, llc];
      const newP = new MetaTile(newPOutline, patch.width * 2);
      for (const child of [7, 2, 3, 4, 28]) {
        newP.addChild(patch.children[child].T, patch.children[child].geom);
      }

      const newFOutline = [
        bps2,
        patch.evalChild(24, 2),
        patch.evalChild(25, 0),
        p252,
        padd(p252, psub(llc, bps1)),
      ];
      const newF = new MetaTile(newFOutline, patch.width * 2);
      for (const child of [21, 20, 22, 23, 24, 25]) {
        newF.addChild(patch.children[child].T, patch.children[child].geom);
      }

      const AAA = newHOutline[2];
      const BBB = padd(newHOutline[1], psub(newHOutline[4], newHOutline[5]));
      const CCC = transPt(rotAbout(BBB, -pi / 3), AAA);
      const newT = new MetaTile([BBB, CCC, AAA], patch.width * 2);
      newT.addChild(patch.children[11].T, patch.children[11].geom);

      newH.recenter();
      newP.recenter();
      newF.recenter();
      newT.recenter();

      return [newH, newT, newP, newF];
    }

    function buildTiles(iterations) {
      let metas = createInitialTiles();
      for (let i = 0; i < iterations; i += 1) {
        metas = constructMetatiles(constructPatch(...metas));
      }

      const out = [];
      metas[0].collect(ident, out);
      return out;
    }

    function computePointBounds(points) {
      const b = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
      for (const point of points) {
        b.minX = Math.min(b.minX, point.x);
        b.maxX = Math.max(b.maxX, point.x);
        b.minY = Math.min(b.minY, point.y);
        b.maxY = Math.max(b.maxY, point.y);
      }
      return b;
    }

    function transformPointList(T, points) {
      return points.map((point) => transPt(T, point));
    }

    function buildTileGeometry(tile) {
      const local = getLocalHoleGeometry();
      return {
        outline: transformPointList(tile.T, hatOutline),
        holeStarts: local.holeStarts.map((start) => ({
          point: transPt(tile.T, start.point),
          skipEdgeA: start.skipEdgeA,
          skipEdgeB: start.skipEdgeB,
        })),
      };
    }

    function computeBounds(tileList) {
      const b = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
      for (let i = 0; i < tileList.length; i += 1) {
        const tile = tileList[i];
        tile.seed = seededNoise(tile.T[2], tile.T[5]);
        tile.hashX = Math.round(tile.T[2] * 1000);
        tile.hashY = Math.round(tile.T[5] * 1000);
        tile.motionKey = `${i}:${tile.hashX}:${tile.hashY}`;
        tile.geometry = buildTileGeometry(tile);
        tile.bounds = computePointBounds(tile.geometry.outline);
        b.minX = Math.min(b.minX, tile.bounds.minX);
        b.maxX = Math.max(b.maxX, tile.bounds.maxX);
        b.minY = Math.min(b.minY, tile.bounds.minY);
        b.maxY = Math.max(b.maxY, tile.bounds.maxY);
      }
      return b;
    }

    function indexKey(cx, cy) {
      return `${cx},${cy}`;
    }

    function buildSpatialIndex(tileList) {
      spatialIndex = new Map();
      for (const tile of tileList) {
        const minCellX = Math.floor(tile.bounds.minX / gridCellSize);
        const maxCellX = Math.floor(tile.bounds.maxX / gridCellSize);
        const minCellY = Math.floor(tile.bounds.minY / gridCellSize);
        const maxCellY = Math.floor(tile.bounds.maxY / gridCellSize);

        for (let cy = minCellY; cy <= maxCellY; cy += 1) {
          for (let cx = minCellX; cx <= maxCellX; cx += 1) {
            const key = indexKey(cx, cy);
            let cell = spatialIndex.get(key);
            if (!cell) {
              cell = [];
              spatialIndex.set(key, cell);
            }
            cell.push(tile);
          }
        }
      }
    }

    function rebuildPatch() {
      leaves = buildTiles(6);
      bounds = computeBounds(leaves);
      assignTileStyles();
      buildSpatialIndex(leaves);
      resetView();
    }

    function resetView() {
      scale = width < 720 ? 36 : 44;
      panX = width / 2 - ((bounds.minX + bounds.maxX) / 2) * scale;
      panY = height / 2 + ((bounds.minY + bounds.maxY) / 2) * scale;
      tileMotion.clear();
      queueRender();
    }

    function resize() {
      dpr = Math.max(1, Math.min(1.5, window.devicePixelRatio || 1));
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (bounds) {
        resetView();
      }
    }

    function worldToScreen(p) {
      const x = p.x * scale + panX;
      const y = -p.y * scale + panY;

      if (!hasSpinTransform()) {
        return { x, y };
      }

      const cx = width * 0.5;
      const cy = height * 0.5;
      const dx = x - cx;
      const dy = y - cy;
      const c = Math.cos(spinAngle);
      const s = Math.sin(spinAngle);
      return {
        x: cx + dx * c - dy * s,
        y: cy + dx * s + dy * c,
      };
    }

    function screenToWorld(x, y) {
      let screenX = x;
      let screenY = y;

      if (hasSpinTransform()) {
        const cx = width * 0.5;
        const cy = height * 0.5;
        const dx = x - cx;
        const dy = y - cy;
        const c = Math.cos(spinAngle);
        const s = Math.sin(spinAngle);
        screenX = cx + dx * c + dy * s;
        screenY = cy - dx * s + dy * c;
      }

      return {
        x: (screenX - panX) / scale,
        y: -(screenY - panY) / scale,
      };
    }

    function hasSpinTransform() {
      return Math.abs(spinAngle) > 0.0001;
    }

    function screenDeltaToPanDelta(dx, dy) {
      if (!hasSpinTransform()) {
        return { x: dx, y: dy };
      }

      const c = Math.cos(spinAngle);
      const s = Math.sin(spinAngle);
      return {
        x: dx * c + dy * s,
        y: -dx * s + dy * c,
      };
    }

    function tileFieldRect() {
      const fieldWidth = width * tileFieldExtent;
      const fieldHeight = height * tileFieldExtent;
      return {
        left: (width - fieldWidth) * 0.5,
        top: (height - fieldHeight) * 0.5,
        right: (width + fieldWidth) * 0.5,
        bottom: (height + fieldHeight) * 0.5,
      };
    }

    function screenRectToWorldBounds(rect, margin = 0) {
      const corners = [
        screenToWorld(rect.left - margin, rect.top - margin),
        screenToWorld(rect.right + margin, rect.top - margin),
        screenToWorld(rect.right + margin, rect.bottom + margin),
        screenToWorld(rect.left - margin, rect.bottom + margin),
      ];
      return computePointBounds(corners);
    }

    function screenPointsBounds(points) {
      return computePointBounds(points);
    }

    function boundsOverlap(a, b) {
      return a.maxX >= b.minX && a.minX <= b.maxX && a.maxY >= b.minY && a.minY <= b.maxY;
    }

    function rectCornerPoints(rect) {
      return [
        pt(rect.left, rect.top),
        pt(rect.right, rect.top),
        pt(rect.right, rect.bottom),
        pt(rect.left, rect.bottom),
      ];
    }

    function pointsTouchRect(points, rect) {
      const pointBounds = screenPointsBounds(points);
      const rectBounds = { minX: rect.left, minY: rect.top, maxX: rect.right, maxY: rect.bottom };
      if (!boundsOverlap(pointBounds, rectBounds)) {
        return false;
      }

      return points.some((point) => point.x >= rect.left && point.x <= rect.right && point.y >= rect.top && point.y <= rect.bottom)
        || rectCornerPoints(rect).some((corner) => pointInPolygon(corner, points));
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function flyStartPoint(target, tile) {
      const offscreen = Math.max(140, Math.min(width, height) * 0.18);
      const drift = (seededNoise(tile.hashY, tile.hashX) - 0.5) * Math.min(width, height) * 0.34;
      const side = Math.floor(tile.seed * 4);

      if (side === 0) {
        return pt(-offscreen, target.y + drift);
      }
      if (side === 1) {
        return pt(width + offscreen, target.y + drift);
      }
      if (side === 2) {
        return pt(target.x + drift, -offscreen);
      }
      return pt(target.x + drift, height + offscreen);
    }

    function animateTileIntoField(item, time, activeKeys) {
      const key = item.tile.motionKey;
      activeKeys.add(key);

      let motion = tileMotion.get(key);
      const targetCenter = polygonCentroid(item.points);

      if (!motion) {
        motion = {
          startTime: time,
          from: flyStartPoint(targetCenter, item.tile),
        };
        tileMotion.set(key, motion);
      }

      const progress = Math.min(1, (time - motion.startTime) / tileMotionDuration);
      const eased = easeOutCubic(progress);
      const offsetX = (motion.from.x - targetCenter.x) * (1 - eased);
      const offsetY = (motion.from.y - targetCenter.y) * (1 - eased);

      return {
        ...item,
        points: item.points.map((point) => pt(point.x + offsetX, point.y + offsetY)),
        holeStarts: item.holeStarts.map((start) => ({
          ...start,
          point: pt(start.point.x + offsetX, start.point.y + offsetY),
        })),
        opacity: 0.18 + eased * 0.82,
      };
    }

    function animatePreparedTiles(items, time) {
      const fieldRect = tileFieldRect();
      const activeKeys = new Set();
      const animated = [];

      for (const item of items) {
        if (pointsTouchRect(item.points, fieldRect)) {
          animated.push(animateTileIntoField(item, time, activeKeys));
        }
      }

      for (const key of tileMotion.keys()) {
        if (!activeKeys.has(key)) {
          tileMotion.delete(key);
        }
      }

      if (animated.some((item) => item.opacity < 0.999)) {
        queueRender();
      }

      return animated;
    }

    function isVisible(tile) {
      const worldBounds = screenRectToWorldBounds(tileFieldRect(), Math.max(120, scale * 5));
      const b = tile.bounds;
      return boundsOverlap(b, worldBounds);
    }

    function visibleTiles() {
      const worldBounds = screenRectToWorldBounds(tileFieldRect(), Math.max(140, scale * 6));
      const minCellX = Math.floor(worldBounds.minX / gridCellSize);
      const maxCellX = Math.floor(worldBounds.maxX / gridCellSize);
      const minCellY = Math.floor(worldBounds.minY / gridCellSize);
      const maxCellY = Math.floor(worldBounds.maxY / gridCellSize);
      const seen = new Set();
      const out = [];

      for (let cy = minCellY; cy <= maxCellY; cy += 1) {
        for (let cx = minCellX; cx <= maxCellX; cx += 1) {
          const cell = spatialIndex.get(indexKey(cx, cy));
          if (!cell) {
            continue;
          }

          for (const tile of cell) {
            if (!seen.has(tile) && isVisible(tile)) {
              seen.add(tile);
              out.push(tile);
            }
          }
        }
      }

      return out;
    }

    function worldPolygon(tile) {
      return tile.geometry ? tile.geometry.outline : hatOutline.map((p) => transPt(tile.T, p));
    }

    function screenPolygon(tile) {
      return hatOutline.map((p) => worldToScreen(transPt(tile.T, p)));
    }

    function beginPolygon(points) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i += 1) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.closePath();
    }

    function drawBackground(time) {
      ctx.fillStyle = currentTheme.bg;
      ctx.fillRect(0, 0, width, height);

      if (currentTheme.key === "hole") {
        drawStars(time, 0.58);
        return;
      }

      if (currentTheme.key === "ocean") {
        drawStars(time, 0.24);
        const glow = ctx.createRadialGradient(width * 0.64, height * 0.2, 0, width * 0.64, height * 0.2, Math.max(width, height) * 0.76);
        glow.addColorStop(0, "rgba(137, 255, 237, 0.24)");
        glow.addColorStop(0.42, "rgba(23, 160, 191, 0.12)");
        glow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);
        return;
      }

      if (currentTheme.key === "fire") {
        drawStars(time, 0.2);
        const ember = ctx.createRadialGradient(width * 0.48, height * 0.98, 0, width * 0.48, height * 0.98, Math.max(width, height) * 0.72);
        ember.addColorStop(0, "rgba(255, 111, 24, 0.42)");
        ember.addColorStop(0.36, "rgba(175, 35, 7, 0.2)");
        ember.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = ember;
        ctx.fillRect(0, 0, width, height);
        return;
      }

      drawStars(time, 0.92);
      const nebula = ctx.createRadialGradient(width * 0.3, height * 0.26, 0, width * 0.3, height * 0.26, Math.max(width, height) * 0.58);
      nebula.addColorStop(0, "rgba(136, 72, 255, 0.24)");
      nebula.addColorStop(0.42, "rgba(33, 139, 255, 0.08)");
      nebula.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = nebula;
      ctx.fillRect(0, 0, width, height);
    }

    function drawStars(time, alpha) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      for (const star of starField) {
        const x = star.x * width;
        const y = star.y * height;
        const pulse = 0.45 + Math.sin(time * 0.001 * star.speed + star.phase) * 0.35;
        const opacity = Math.max(0.14, pulse) * alpha;
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.beginPath();
        ctx.arc(x, y, star.size, 0, pi * 2);
        ctx.fill();

        if (star.size > 1.8 && opacity > 0.42) {
          ctx.strokeStyle = `rgba(174, 239, 255, ${opacity * 0.35})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(x - star.size * 4, y);
          ctx.lineTo(x + star.size * 4, y);
          ctx.moveTo(x, y - star.size * 4);
          ctx.lineTo(x, y + star.size * 4);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawOceanAtmosphere(time) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.lineCap = "round";
      for (let i = 0; i < 9; i += 1) {
        const y = height * (0.16 + i * 0.095) + Math.sin(time * 0.00045 + i) * 16;
        const drift = Math.sin(time * 0.0003 + i * 1.7) * 48;
        const grad = ctx.createLinearGradient(0, y, width, y + 44);
        grad.addColorStop(0, "rgba(98, 226, 244, 0)");
        grad.addColorStop(0.48, "rgba(170, 255, 238, 0.08)");
        grad.addColorStop(1, "rgba(98, 226, 244, 0)");
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.4 + i * 0.08;
        ctx.beginPath();
        ctx.moveTo(-80, y);
        ctx.bezierCurveTo(width * 0.28 + drift, y - 28, width * 0.66 - drift, y + 42, width + 80, y + 8);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawCosmicAtmosphere(time) {
      drawStars(time, 0.46);
    }

    function drawAtmosphere(time) {
      if (currentTheme.key === "ocean") {
        drawOceanAtmosphere(time);
      } else if (currentTheme.key === "cosmic") {
        drawCosmicAtmosphere(time);
      }
    }

    function prepareVisibleTiles(time) {
      const tiles = visibleTiles();
      const vertexCount = hatOutline.length;
      const pointsPerTile = dropEnabled
        ? vertexCount + getLocalHoleGeometry().holeStarts.length
        : vertexCount;
      const pointCount = tiles.length * pointsPerTile;

      if (wasmPalette && wasmMemory && pointCount <= wasmMaxPoints) {
        const items = [];
        let cursor = 0;

        for (const tile of tiles) {
          const geometry = tile.geometry || buildTileGeometry(tile);
          const item = {
            tile,
            outlineOffset: cursor,
            holeStartOffsets: [],
          };
          items.push(item);

          for (const world of geometry.outline) {
            const index = wasmInputOffset + cursor * 2;
            wasmMemory[index] = world.x;
            wasmMemory[index + 1] = world.y;
            cursor += 1;
          }

          if (dropEnabled) {
            for (const start of geometry.holeStarts) {
              item.holeStartOffsets.push({
                offset: cursor,
                skipEdgeA: start.skipEdgeA,
                skipEdgeB: start.skipEdgeB,
              });
              const index = wasmInputOffset + cursor * 2;
              wasmMemory[index] = start.point.x;
              wasmMemory[index + 1] = start.point.y;
              cursor += 1;
            }
          }
        }

        wasmPalette.transform_points(
          pointCount,
          width,
          height,
          scale,
          panX,
          panY,
          Math.cos(spinAngle),
          Math.sin(spinAngle),
          hasSpinTransform() ? 1 : 0,
        );

        const prepared = items.map((item) => {
          const points = [];
          for (let i = 0; i < vertexCount; i += 1) {
            const index = wasmOutputOffset + (item.outlineOffset + i) * 2;
            points.push(pt(wasmMemory[index], wasmMemory[index + 1]));
          }

          const holeStarts = item.holeStartOffsets.map((start) => {
            const index = wasmOutputOffset + start.offset * 2;
            return {
              point: pt(wasmMemory[index], wasmMemory[index + 1]),
              skipEdgeA: start.skipEdgeA,
              skipEdgeB: start.skipEdgeB,
            };
          });

          return {
            tile: item.tile,
            points,
            holeStarts,
          };
        });

        return animatePreparedTiles(prepared, time);
      }

      const prepared = tiles.map((tile) => {
        const geometry = tile.geometry || buildTileGeometry(tile);
        return {
          tile,
          points: geometry.outline.map((point) => worldToScreen(point)),
          holeStarts: dropEnabled ? geometry.holeStarts.map((start) => ({
            point: worldToScreen(start.point),
            skipEdgeA: start.skipEdgeA,
            skipEdgeB: start.skipEdgeB,
          })) : [],
        };
      });

      return animatePreparedTiles(prepared, time);
    }

    function polygonCentroid(points) {
      let x = 0;
      let y = 0;
      for (const point of points) {
        x += point.x;
        y += point.y;
      }
      return pt(x / points.length, y / points.length);
    }

    function insetPoint(point, centre, amount) {
      const dx = centre.x - point.x;
      const dy = centre.y - point.y;
      const length = Math.hypot(dx, dy);
      if (length < 0.001) {
        return point;
      }

      return pt(point.x + dx / length * amount, point.y + dy / length * amount);
    }

    function verticalBoundaryHit(points, origin, skipEdgeA, skipEdgeB) {
      const x = origin.x;
      const eps = 0.35;
      let best = null;
      let bestY = Infinity;

      for (let i = 0; i < points.length; i += 1) {
        const next = (i + 1) % points.length;
        if (i === skipEdgeA || i === skipEdgeB) {
          continue;
        }

        const a = points[i];
        const b = points[next];
        const minX = Math.min(a.x, b.x);
        const maxX = Math.max(a.x, b.x);

        if (x < minX - eps || x > maxX + eps) {
          continue;
        }

        let hitY = null;
        const dx = b.x - a.x;
        if (Math.abs(dx) < eps) {
          if (Math.abs(x - a.x) > eps) {
            continue;
          }
          const below = [a.y, b.y].filter((value) => value > origin.y + eps);
          if (below.length) {
            hitY = Math.min(...below);
          }
        } else {
          const t = (x - a.x) / dx;
          if (t < -0.001 || t > 1.001) {
            continue;
          }
          hitY = a.y + t * (b.y - a.y);
        }

        if (hitY !== null && hitY > origin.y + eps && hitY < bestY) {
          bestY = hitY;
          best = pt(x, hitY);
        }
      }

      return best;
    }

    function pointInPolygon(point, points) {
      let inside = false;
      for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
        const a = points[i];
        const b = points[j];
        const crosses = (a.y > point.y) !== (b.y > point.y);
        if (crosses) {
          const x = (b.x - a.x) * (point.y - a.y) / (b.y - a.y) + a.x;
          if (point.x < x) {
            inside = !inside;
          }
        }
      }
      return inside;
    }

    function getLocalHoleGeometry() {
      if (cachedLocalHoleGeometry) {
        return cachedLocalHoleGeometry;
      }

      const centre = polygonCentroid(hatOutline);
      const holeStarts = [];

      for (let i = 0; i < hatOutline.length; i += 1) {
        const prevEdge = (i - 1 + hatOutline.length) % hatOutline.length;
        holeStarts.push({
          point: insetPoint(hatOutline[i], centre, holeLineInset),
          skipEdgeA: i,
          skipEdgeB: prevEdge,
        });
      }

      cachedLocalHoleGeometry = { holeStarts };
      return cachedLocalHoleGeometry;
    }

    function drawHoleShade(points, color) {
      ctx.save();
      beginPolygon(points);
      ctx.clip();
      const bandDepth = Math.max(7, Math.min(20, scale * 0.28));
      const dark = scaleColor(color, 0.33);

      for (let i = 0; i < points.length; i += 1) {
        const next = (i + 1) % points.length;
        const a = points[i];
        const b = points[next];
        const sample = pt((a.x + b.x) * 0.5, (a.y + b.y) * 0.5 + bandDepth * 0.55);
        if (!pointInPolygon(sample, points)) {
          continue;
        }

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.lineTo(b.x, b.y + bandDepth);
        ctx.lineTo(a.x, a.y + bandDepth);
        ctx.closePath();
        ctx.fillStyle = colorString(dark, 0.34);
        ctx.fill();

        ctx.strokeStyle = colorString(scaleColor(color, 0.22), 0.32);
        ctx.lineWidth = Math.max(0.55, scale * 0.01);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y + bandDepth);
        ctx.lineTo(b.x, b.y + bandDepth);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawHoleLines(points, holeStarts, color) {
      ctx.save();
      beginPolygon(points);
      ctx.clip();
      ctx.lineCap = "round";

      for (const startInfo of holeStarts) {
        const start = startInfo.point;
        const hit = verticalBoundaryHit(points, start, startInfo.skipEdgeA, startInfo.skipEdgeB);
        if (!hit || hit.y - start.y < holeMinLineDepth) {
          continue;
        }

        ctx.lineWidth = Math.max(1.1, scale * 0.03);
        ctx.strokeStyle = colorString(scaleColor(color, 0.24), 0.44);
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(hit.x, hit.y);
        ctx.stroke();

        ctx.lineWidth = Math.max(0.65, scale * 0.011);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.13)";
        ctx.beginPath();
        ctx.moveTo(start.x + 0.7, start.y + 0.6);
        ctx.lineTo(hit.x + 0.7, hit.y - 0.6);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawTile(item) {
      const { tile, points, holeStarts } = item;
      const fill = tile.fill || hexToColor(currentTheme.palette[0]);

      ctx.save();
      ctx.globalAlpha *= item.opacity ?? 1;

      beginPolygon(points);
      ctx.fillStyle = colorString(fill, 1);
      ctx.fill();

      if (dropEnabled) {
        drawHoleShade(points, fill);
        drawHoleLines(points, holeStarts, fill);
      }

      beginPolygon(points);
      ctx.strokeStyle = currentTheme.edge;
      ctx.lineWidth = Math.max(0.45, scale * 0.008);
      ctx.stroke();
      ctx.restore();
    }

    function draw(time = performance.now()) {
      renderQueued = false;
      const delta = lastFrameTime ? Math.min(42, time - lastFrameTime) : 16;
      lastFrameTime = time;

      if (spinEnabled) {
        spinAngle += delta * 0.00145;
      }

      ctx.clearRect(0, 0, width, height);
      drawBackground(time);

      const tiles = prepareVisibleTiles(time);
      for (const item of tiles) {
        drawTile(item);
      }

      drawAtmosphere(time);

      if (spinEnabled || currentTheme.animated) {
        queueRender();
      }
    }

    function queueRender() {
      if (renderQueued) {
        return;
      }
      renderQueued = true;
      requestAnimationFrame(draw);
    }

    canvas.addEventListener("pointerdown", (event) => {
      if (activePointerId !== null) {
        return;
      }

      activePointerId = event.pointerId;
      startX = event.clientX;
      startY = event.clientY;
      startPanX = panX;
      startPanY = panY;
      canvas.classList.add("dragging");
      canvas.setPointerCapture(activePointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (event.pointerId !== activePointerId) {
        return;
      }

      const delta = screenDeltaToPanDelta(event.clientX - startX, event.clientY - startY);
      panX = startPanX + delta.x;
      panY = startPanY + delta.y;
      queueRender();
    });

    function endDrag(event) {
      if (event.pointerId !== activePointerId) {
        return;
      }

      activePointerId = null;
      canvas.classList.remove("dragging");
      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
    }

    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    for (const button of themeButtons) {
      button.addEventListener("click", () => {
        applyTheme(button.dataset.theme);
      });
    }

    dropButton.addEventListener("click", () => {
      setDropMode(!dropEnabled);
    });

    spinButton.addEventListener("click", () => {
      setSpinMode(!spinEnabled);
    });

    resetButton.addEventListener("click", () => {
      resetView();
    });

    window.addEventListener("resize", resize);

    resize();
    rebuildPatch();
    initGeometryWasm();
  </script>
</body>
</html>
